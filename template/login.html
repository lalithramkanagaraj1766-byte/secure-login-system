{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h2>Welcome back</h2>
  <p class="muted">Log in with your username or email.</p>
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="identifier">Username or email</label>
    <input id="identifier" name="identifier" type="text" maxlength="120" required autocomplete="username" value="{{ identifier }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="128" required autocomplete="current-password">
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>
  <p class="muted center">No account yet? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}
